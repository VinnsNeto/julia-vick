<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Lista de espera · Julia Vick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,600;62..125,800;62..125,900&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root { --tinta:#111; --papel:#F6F3EE; --branco:#fff; --salmao:#F28C74; --salmao-escuro:#C95F48; --cinza:#6E6A64; --linha:#E3DDD3; --areia:#EDE6DB; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--papel); color: var(--tinta); font-family: 'Archivo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.45; }
.wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; }
h1 { font-weight: 900; font-stretch: 62%; text-transform: uppercase; font-size: clamp(2rem, 7vw, 2.8rem); line-height: .95; }
h1 em { font-family: 'Instrument Serif', serif; font-weight: 400; text-transform: none; color: var(--salmao-escuro); }
.topo { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.topo p { color: var(--cinza); font-size: .9rem; margin-top: 6px; }
button, select, input { font: inherit; }
.btn { cursor: pointer; border: 1.5px solid var(--tinta); background: var(--branco); color: var(--tinta); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: .86rem; }
.btn.cheio { background: var(--salmao); border-color: var(--salmao); }
.btn:hover { background: var(--areia); }
.btn.cheio:hover { background: #E57A61; }

/* login */
.login { max-width: 380px; margin: 12vh auto 0; background: var(--branco); border: 1px solid var(--linha); border-radius: 18px; padding: 26px 22px; }
.login h1 { font-size: 2.2rem; }
.login p { color: var(--cinza); font-size: .9rem; margin: 8px 0 18px; }
.login input { width: 100%; border: 1.5px solid var(--linha); border-radius: 12px; padding: 13px; font-size: 1rem; outline: none; }
.login input:focus { border-color: var(--salmao); }
.login .btn { width: 100%; margin-top: 12px; padding: 13px; font-size: .95rem; }
.msg-erro { color: #B3412B; font-size: .84rem; margin-top: 10px; min-height: 1.2em; }

/* números */
.numeros { margin-top: 22px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.num { background: var(--branco); border: 1px solid var(--linha); border-radius: 14px; padding: 14px; cursor: pointer; text-align: left; transition: border-color .15s; }
.num b { display: block; font-weight: 900; font-stretch: 62%; font-size: 2.2rem; line-height: 1; }
.num span { font-size: .78rem; color: var(--cinza); font-weight: 600; }
.num[aria-pressed=true] { border-color: var(--tinta); box-shadow: inset 0 0 0 1px var(--tinta); }
.num.total b { color: var(--salmao-escuro); }
@media (max-width: 560px) { .numeros { grid-template-columns: repeat(2, 1fr); } }

.barra { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.barra input { flex: 1; min-width: 180px; border: 1.5px solid var(--linha); border-radius: 10px; padding: 9px 12px; background: var(--branco); outline: none; }
.barra input:focus { border-color: var(--salmao); }

/* lista */
.lista { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--branco); border: 1px solid var(--linha); border-left: 4px solid var(--salmao); border-radius: 8px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: start; }
.card.contatado { border-left-color: #E8B04A; }
.card.agendado { border-left-color: #3E9B6A; }
.card.desistiu { border-left-color: #BDB6AC; opacity: .7; }
.pos { font-weight: 900; font-stretch: 62%; font-size: 1.9rem; line-height: 1; color: var(--salmao-escuro); min-width: 2.2ch; }
.info b { font-size: 1rem; }
.info .linha { font-size: .84rem; color: var(--cinza); margin-top: 2px; word-break: break-word; }
.info .linha a { color: var(--tinta); }
.chip { display: inline-block; margin-left: 6px; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: var(--areia); border-radius: 999px; padding: 2px 8px; vertical-align: middle; }
.acoes { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 150px; }
.acoes select { border: 1.5px solid var(--linha); border-radius: 8px; padding: 7px 8px; background: var(--branco); }
.acoes .zap { text-align: center; text-decoration: none; background: #25D366; color: #fff; border-radius: 8px; padding: 7px; font-size: .82rem; font-weight: 600; }
.obs { grid-column: 2 / 4; }
.obs input { width: 100%; border: 1px dashed var(--linha); border-radius: 8px; padding: 7px 10px; font-size: .84rem; background: #FCFBF9; outline: none; }
.obs input:focus { border-style: solid; border-color: var(--salmao); }
.excluir { background: none; border: 0; color: #A0998F; font-size: .76rem; cursor: pointer; text-decoration: underline; justify-self: start; grid-column: 2 / 4; }
.excluir:hover { color: #B3412B; }
@media (max-width: 620px) { .card { grid-template-columns: auto 1fr; } .acoes { grid-column: 1 / 3; flex-direction: row; min-width: 0; } .acoes > * { flex: 1; } .obs, .excluir { grid-column: 1 / 3; } }
.vazio { text-align: center; color: var(--cinza); padding: 40px 10px; background: var(--branco); border: 1px dashed var(--linha); border-radius: 14px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--tinta); color: #fff; border-radius: 10px; padding: 10px 16px; font-size: .86rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--salmao); outline-offset: 2px; }
</style>
</head>
<body>

<div class="login" id="telaLogin">
  <h1>Lista de <em>espera</em></h1>
  <p>Painel da Julia. Digite a senha pra ver quem está na fila.</p>
  <form id="formLogin">
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
    <button class="btn cheio" type="submit">Entrar</button>
    <p class="msg-erro" id="erroLogin" role="alert"></p>
  </form>
</div>

<div class="wrap" id="telaPainel" hidden>
  <div class="topo">
    <div><h1>Lista de <em>espera</em> 2027</h1><p id="atualizado">Carregando...</p></div>
    <div style="display:flex;gap:8px"><button class="btn" id="btnCsv">Baixar planilha</button><button class="btn" id="btnSair">Sair</button></div>
  </div>

  <div class="numeros" id="numeros">
    <button class="num total" data-f="todos" aria-pressed="true"><b id="nTotal">0</b><span>Na lista</span></button>
    <button class="num" data-f="aguardando" aria-pressed="false"><b id="nAguardando">0</b><span>Aguardando</span></button>
    <button class="num" data-f="contatado" aria-pressed="false"><b id="nContatado">0</b><span>Contatados</span></button>
    <button class="num" data-f="agendado" aria-pressed="false"><b id="nAgendado">0</b><span>Agendados</span></button>
  </div>

  <div class="barra">
    <input type="search" id="busca" placeholder="Buscar por nome, e-mail ou WhatsApp">
    <button class="btn" id="btnAtualizar">Atualizar</button>
  </div>

  <div class="lista" id="lista"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>
(function () {
  var cfg = window.LISTA_CONFIG || {};
  var senha = null, dados = [], filtro = 'todos';
  var $ = function (id) { return document.getElementById(id); };
  var MOD = { online: 'Online', presencial: 'Presencial', tanto_faz: 'Tanto faz' };

  function rpc(nome, corpo) {
    return fetch(cfg.SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/rpc/' + nome, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: cfg.SUPABASE_KEY, Authorization: 'Bearer ' + cfg.SUPABASE_KEY },
      body: JSON.stringify(corpo)
    }).then(function (r) {
      if (r.status === 204) return null;
      return r.json().then(function (j) { if (!r.ok) throw j; return j; });
    });
  }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('on'); }, 2200); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fone(n) { return n.length === 11 ? '(' + n.slice(0, 2) + ') ' + n.slice(2, 7) + '-' + n.slice(7) : '(' + n.slice(0, 2) + ') ' + n.slice(2, 6) + '-' + n.slice(6); }
  function data(iso) { var d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }

  function carregar() {
    return rpc('painel_listar', { p_senha: senha }).then(function (lista) {
      dados = lista || [];
      $('atualizado').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      desenhar();
    });
  }

  function desenhar() {
    var ativos = dados.filter(function (d) { return d.status !== 'desistiu'; });
    $('nTotal').textContent = ativos.length;
    ['aguardando', 'contatado', 'agendado'].forEach(function (s) {
      $('n' + s[0].toUpperCase() + s.slice(1)).textContent = dados.filter(function (d) { return d.status === s; }).length;
    });
    var pos = {}; ativos.forEach(function (d, i) { pos[d.id] = i + 1; });
    var q = $('busca').value.trim().toLowerCase(), qd = q.replace(/\D/g, '');
    var vis = dados.filter(function (d) {
      if (filtro !== 'todos' && d.status !== filtro) return false;
      if (filtro === 'todos' && d.status === 'desistiu' && !q) return false;
      if (!q) return true;
      return d.nome.toLowerCase().indexOf(q) > -1 || d.email.indexOf(q) > -1 || (qd && d.whatsapp.indexOf(qd) > -1);
    });
    if (!vis.length) { $('lista').innerHTML = '<div class="vazio">' + (dados.length ? 'Ninguém nesse filtro.' : 'Ainda ninguém na lista. Quando alguém se inscrever pela página, aparece aqui.') + '</div>'; return; }
    $('lista').innerHTML = vis.map(function (d) {
      var msg = encodeURIComponent('Oi, ' + d.nome.split(' ')[0] + '! Aqui é a Julia Vick. Você entrou na minha lista de espera e a agenda de atendimentos abriu. Quer agendar seu horário?');
      return '<div class="card ' + d.status + '" data-id="' + d.id + '">' +
        '<span class="pos">' + (pos[d.id] ? pos[d.id] : '–') + '</span>' +
        '<div class="info"><b>' + esc(d.nome) + '</b><span class="chip">' + MOD[d.modalidade] + '</span>' +
          '<div class="linha">' + fone(d.whatsapp) + ' · <a href="mailto:' + esc(d.email) + '">' + esc(d.email) + '</a></div>' +
          '<div class="linha">Entrou em ' + data(d.criado_em) + '</div></div>' +
        '<div class="acoes"><select aria-label="Status de ' + esc(d.nome) + '" data-acao="status">' +
          ['aguardando', 'contatado', 'agendado', 'desistiu'].map(function (s) { return '<option value="' + s + '"' + (s === d.status ? ' selected' : '') + '>' + { aguardando: 'Aguardando', contatado: 'Contatado', agendado: 'Agendado', desistiu: 'Desistiu' }[s] + '</option>'; }).join('') +
          '</select><a class="zap" target="_blank" rel="noopener" href="https://wa.me/55' + d.whatsapp + '?text=' + msg + '">Chamar no WhatsApp</a></div>' +
        '<div class="obs"><input data-acao="obs" placeholder="Anotação (só você vê)" value="' + esc(d.observacao) + '" maxlength="300"></div>' +
        '<button class="excluir" data-acao="excluir">Excluir dados (pedido LGPD)</button>' +
      '</div>';
    }).join('');
  }

  function salvar(id, campos) {
    var d = dados.filter(function (x) { return x.id === id; })[0];
    var novo = Object.assign({}, d, campos);
    return rpc('painel_atualizar', { p_senha: senha, p_id: id, p_status: novo.status, p_observacao: novo.observacao || null })
      .then(function () { Object.assign(d, campos); desenhar(); toast('Salvo'); })
      .catch(function () { toast('Não consegui salvar. Tenta de novo.'); desenhar(); });
  }

  $('lista').addEventListener('change', function (e) {
    var card = e.target.closest('.card'); if (!card) return;
    var id = Number(card.dataset.id);
    if (e.target.dataset.acao === 'status') salvar(id, { status: e.target.value });
    if (e.target.dataset.acao === 'obs') salvar(id, { observacao: e.target.value.trim() });
  });
  $('lista').addEventListener('click', function (e) {
    if (e.target.dataset.acao !== 'excluir') return;
    var card = e.target.closest('.card'), id = Number(card.dataset.id);
    var d = dados.filter(function (x) { return x.id === id; })[0];
    if (!confirm('Excluir de vez os dados de ' + d.nome + '? Isso não pode ser desfeito.')) return;
    rpc('painel_excluir', { p_senha: senha, p_id: id }).then(function () {
      dados = dados.filter(function (x) { return x.id !== id; }); desenhar(); toast('Dados excluídos');
    }).catch(function () { toast('Não consegui excluir.'); });
  });
  $('numeros').addEventListener('click', function (e) {
    var b = e.target.closest('.num'); if (!b) return;
    filtro = b.dataset.f;
    [].forEach.call(document.querySelectorAll('.num'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    desenhar();
  });
  $('busca').addEventListener('input', desenhar);
  $('btnAtualizar').addEventListener('click', function () { carregar().then(function () { toast('Lista atualizada'); }); });
  $('btnSair').addEventListener('click', function () { try { sessionStorage.removeItem('jv_painel'); } catch (e) {} location.reload(); });
  $('btnCsv').addEventListener('click', function () {
    var linhas = [['posicao', 'nome', 'whatsapp', 'email', 'modalidade', 'status', 'anotacao', 'entrou_em']];
    var n = 0;
    dados.forEach(function (d) { linhas.push([d.status === 'desistiu' ? '' : ++n, d.nome, d.whatsapp, d.email, MOD[d.modalidade], d.status, d.observacao || '', data(d.criado_em)]); });
    var csv = '﻿' + linhas.map(function (l) { return l.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(';'); }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'lista-de-espera-julia-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
  });

  function entrar(s) {
    senha = s;
    return carregar().then(function () {
      try { sessionStorage.setItem('jv_painel', s); } catch (e) {}
      $('telaLogin').hidden = true; $('telaPainel').hidden = false;
    });
  }
  $('formLogin').addEventListener('submit', function (e) {
    e.preventDefault(); $('erroLogin').textContent = '';
    entrar($('senha').value).catch(function () { senha = null; $('erroLogin').textContent = 'Senha incorreta.'; });
  });
  var salva = null; try { salva = sessionStorage.getItem('jv_painel'); } catch (e) {}
  if (salva) entrar(salva).catch(function () { try { sessionStorage.removeItem('jv_painel'); } catch (e) {} });
})();
</script>
</body>
</html>
